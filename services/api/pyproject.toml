[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencards-api"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
  "rlcard-guandan @ git+https://github.com/Choysang/rlcard-guandan.git@6ebe65a14a0bfe6140df9f231e7bf4a340c94f34",
  "numpy==1.26.4",
  "torch==2.2.2",
  "Flask==3.1.3",
  "flask-cors==6.0.5",
  "openai==2.48.0",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "flask-socketio==5.6.1", "simple-websocket==1.1.0"]

[project.scripts]
opencards-api = "opencards_api.app:main"
opencards-worker = "opencards_worker.main:main"

[tool.setuptools.packages.find]
include = ["opencards_api*", "opencards_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
